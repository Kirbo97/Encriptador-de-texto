        <link rel="stylesheet" href="./CSS/style.css"> <!-- Conecta el archivo CSS para ser usado en la pagina --><!-- Este CSS es para darle forma y diseño a nuestra pagina-->
        <script type="text/javascript" src="./JS/funciones.js"></script> <!-- Conecta el archivo js para ser usado en la pagina --><!-- Este sj contiene las funciones de encriptar y desencriptar de la pagina-->
    </head>
    
    <body>
        <div id="content">
            <main>
                <div class="movil">
                    <form> <!-- Para crear formulario en mi pagina -->
                        <div> <img src="IMG/logo.png"  alt="logo" class="alura"></img> </div><!-- Conecta el archivo jpg para ser usado en la pagina-->
                        
                        <h1>Encriptador y Desencriptador de palabras</h1> <!-- Para titulo que se visualisa -->
                        
                        <div class="inicio">
                            <!-- Usar el mismo nombre del for e id ayuda a que esten entrelasados -->
                            <label for="frase">Ingrese una palabra</label> <!-- muestra texto en pantalla de un formulario-->
                            <textarea id="frase" name="" type="text" onkeyup="remplazar(this)" placeholder="Ingrese una palabra"></textarea>
                            <!-- crea un cuadro para ingresar texto y que sea obligatorio de llenar dentro de un formulario, ademas tendra una funcion que se estara cumpliendo consecutivamente-->
                        </div> 
        
                        <img src="IMG/infor.png"  alt="infor"></img><!-- Conecta el archivo jpg para ser usado en la pagina-->
        
                        <button type="button" onclick="encriptar()" id="enc">Encriptar</button> <!-- crea un boton que al ser presionado va a ejecutar una funcion del js-->
                        <button type="button" onclick="desencriptar()" id="desen">Desencriptar</button>
                    </form>
        
                    <form class="mostrar" id="cuadro_dos"> <!-- Para crear formulario en mi pagina -->
                        <div style="text-align: center;"> <img src="IMG/vacio.png"  id="busqueda"></img>  </div><!-- Conecta el archivo jpg para ser usado en la pagina-->
                       
                        <h1 id="mensaje">Ningun texto fue encontrado</h1> <!-- Para titulo que se visualisa -->
                                        
                        <div class="codificar"><textarea id="respuesta"  type="text" placeholder="!Ingrese un texto para comenzar." disabled="disabled"></textarea></div> <!-- muestra texto en pantalla de un formulario y sera el encargado de mostrar el resultado de la codificacion y decodificacion -->
                        
                        <button type="button" onclick="copiar()" disabled="disabled" id="cop">Copiar</button><!-- crea un boton que al ser presionado va a ejecutar una funcion del js-->
                    </form>
                </div>
